[package]
name = "gatehouse_senet"
version = "1.0.0"
edition = "2021"
authors = ["Deepmind Team <advanced-agentic-coding@google.com>"]
description = "Ancient Egyptian Senet Engine with Stochastic Expectimax Search, Kendall & Bell Rules, and Procedural Shaders"

[lib]
name = "gatehouse_senet"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
