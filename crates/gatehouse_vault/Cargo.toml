[package]
name = "gatehouse_vault"
version = "0.1.0"
edition = "2021"
authors = ["Doherty Security Services <sec@dss.com.au>"]
description = "High-performance native cryptographic vault and hardware attestation engine for Gatehouse"

[lib]
name = "gatehouse_vault"
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
